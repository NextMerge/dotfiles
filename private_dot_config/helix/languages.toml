[language-server]
oxlint = { command = "oxlint", args = ["--lsp"] }

[language-server.tsgo]
command = 'tsgo'
args = ['--lsp', '--stdio']

[language-server.tsgo.config.typescript]
updateImportsOnFileMove.enabled = "always"
suggest.completeFunctionCalls = true
tsserver.enableTracing = true
inlayHints.parameterNames.enabled = "all"
inlayHints.parameterTypes.enabled = true
inlayHints.variableTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.functionLikeReturnTypes = true
inlayHints.enumMemberValues.enabled = true
format.enable = false
tsserver.experimental.enableProjectDiagnostics = true

[language-server.tailwindcss]
command = "tailwindcss-language-server"
args = ["--stdio"]

[[language]]
name = "css"
language-servers = ["vscode-css-language-server", "tailwindcss", "oxlint"]
auto-format = true

[[language]]
name = "html"
language-servers = ["vscode-html-language-server", "tailwindcss"]

[[language]]
name = "javascript"
auto-format = true
language-servers = [
  # { name = "typescript-language-server", except-features = [ "format" ] },
  "tsgo",
  "oxlint",
]

[[language]]
name = "typescript"
auto-format = true
language-servers = [
  # { name = "typescript-language-server", except-features = [ "format" ] },
  "tsgo",
  "oxlint",
]

[[language]]
name = "jsx"
auto-format = true
language-servers = [
  # { name = "typescript-language-server", except-features = [ "format" ] },
  "tsgo",
  "tailwindcss",
  "oxlint",
]

[[language]]
name = "tsx"
auto-format = true
language-servers = [
  # { name = "typescript-language-server", except-features = [ "format" ] },
  "tsgo",
  "tailwindcss",
  "oxlint",
]

[[language]]
name = "json"
language-servers = ["vscode-json-language-server", "oxlint"]

[[language]]
name = "jsonc"
language-servers = ["vscode-json-language-server", "oxlint"]

[[language]]
name = "fish"
formatter = { command = "fish_indent" }
auto-format = true

# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
promptToReturnFromSubprocess: false

git:
  overrideGpg: true

gui:
  nerdFontsVersion: "3"
  scrollHeight: 5

keybinding:
  universal:
    prevBlock-alt: "" # no-op to free 'h'
    jumpToBlock:
      - "1"
      - "c"
      - "h"
      - "t"
      - "$"
  branches:
    checkoutBranchByName: s
  commits:
    setFixupMessage: "" # no-op to free 's'

customCommands:
  - key: "G"
    context: "localBranches"
    description: "View MR on GitLab"
    command: "glab mr view {{.SelectedLocalBranch.Name}} --web"
    loadingText: "Opening MR..."
  - key: "o"
    context: "localBranches"
    description: "Create draft MR + review in tuicr"
    prompts:
      - type: "input"
        title: "MR Title:"
        key: "Title"
        initialValue: "Draft: chore: "
    command: >-
      set num (glab mr create
      --source-branch {{.SelectedLocalBranch.Name | quote}}
      --title {{.Form.Title | quote}}
      --push --yes |
      grep -oE 'merge_requests/[0-9]+' | cut -d/ -f2);
      test -n "$num"; and tuicr mr "$num"
    output: terminal
